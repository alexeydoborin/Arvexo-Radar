name: CD

# Builds and publishes container images to GHCR, then (on main only)
# deploys them to the target server over SSH. See docs/22-ci-cd.md for the
# full pipeline description and the secrets this workflow needs.
#
# The main-branch path is gated on CI via the native `workflow_run` event
# (fires the instant the CI workflow finishes) rather than a third-party
# polling action — no extra job, no wait-interval delay, no separate
# runner just to sit there polling the checks API.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to server after building images"
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    # A failed/cancelled CI run on main must not produce or deploy an
    # image; tag pushes and manual dispatch aren't gated on CI at all.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      api_image: ${{ steps.api_meta.outputs.tags }}
      web_image: ${{ steps.web_meta.outputs.tags }}
      commit_sha: ${{ steps.resolve_sha.outputs.value }}
    steps:
      - name: Resolve commit SHA to build
        id: resolve_sha
        # workflow_run's own github.sha is the workflow FILE's branch tip,
        # not necessarily the commit CI actually validated — always use
        # the triggering run's head_sha when present.
        run: echo "value=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_sha.outputs.value }}

      - name: Lowercase image namespace
        id: namespace
        run: echo "value=${REGISTRY,,}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata (api/worker share one image; only the
          command differs — see docker-compose.prod.yml)
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.namespace.outputs.value }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image metadata
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.namespace.outputs.value }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # NEXT_PUBLIC_* is inlined into the client bundle at build time
          # (see frontend/Dockerfile) — docker-compose.prod.yml's .env has
          # no effect on it. Update this if the deploy domain ever changes.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://radar.arvexo.ru/api/v1

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    # workflow_run only fires for main (see `branches:` filter above), so
    # reaching this job that way already means "CI passed on main". Tag
    # pushes publish images without touching the server; workflow_dispatch
    # respects its own `deploy` input.
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    environment:
      name: production
      url: https://radar.arvexo.ru
    steps:
      - name: Resolve image tags for this commit
        id: images
        run: |
          SHA="${{ needs.build-and-push.outputs.commit_sha }}"
          echo "api=${REGISTRY,,}/${GITHUB_REPOSITORY,,}-api:sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY,,}/${GITHUB_REPOSITORY,,}-web:sha-${SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: API_IMAGE,WEB_IMAGE,GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # DEPLOY_PATH is a git clone of this repo (see docs/22-ci-cd.md
            # section 6.2) so docker-compose.prod.yml tracks main without a
            # separate file-copy step.
            git fetch --depth 1 origin main
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export API_IMAGE="${{ steps.images.outputs.api }}"
            export WEB_IMAGE="${{ steps.images.outputs.web }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # Idempotent safety net: the api container already runs this on
            # start, but running it here surfaces a migration failure in the
            # deploy log instead of only in `docker compose logs api`.
            # The container can still be between creation and its own
            # entrypoint migration when Compose returns. Retry the explicit
            # verification instead of failing a healthy deploy on that race.
            migration_verified=false
            for i in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head; then
                migration_verified=true
                break
              fi
              echo "Migration verification attempt ${i}/15 failed; retrying in 2s..."
              sleep 2
            done
            if [ "$migration_verified" != true ]; then
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=80 api
              exit 1
            fi
            docker image prune -f
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - name: Smoke test /health and /ready
        # Hits the loopback-only container port directly (proves the
        # containers themselves are healthy) rather than the public
        # https://radar.arvexo.ru path, so this still works before
        # nginx/DNS/TLS are set up on a fresh server.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: false
          script: |
            set -uo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            API_PORT="$(grep -E '^API_HOST_PORT=' .env | cut -d= -f2)"
            API_PORT="${API_PORT:-38000}"

            # `docker compose up -d` returns as soon as containers are
            # created, not once uvicorn is actually accepting connections —
            # the api container's own entrypoint still has to finish
            # `alembic upgrade head` first. Retry instead of racing it.
            for i in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/health" \
                 && curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/ready"; then
                echo "API healthy after ${i} attempt(s)."
                exit 0
              fi
              echo "Attempt ${i}/15: API not ready yet, retrying in 3s..."
              sleep 3
            done

            echo "::error::API did not become healthy within 45s"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=80 api
            exit 1

      - name: Smoke test public landing and redirects
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            origin="https://radar.arvexo.ru"

            # nginx can briefly reach the old upstream while Compose swaps
            # containers. Wait for the public landing and its static assets
            # instead of turning that expected handover into a failed CD run.
            public_ready=false
            for i in $(seq 1 20); do
              if curl -fsS "${origin}/" | grep -q "Видьте эффект ИИ" \
                 && curl -fsS "${origin}/assets/radar-overview.png" >/dev/null \
                 && curl -fsS "${origin}/images/prompt-radar.png" >/dev/null; then
                public_ready=true
                echo "Public landing healthy after ${i} attempt(s)."
                break
              fi
              echo "Attempt ${i}/20: public landing not ready yet, retrying in 3s..."
              sleep 3
            done
            if [ "$public_ready" != true ]; then
              echo "::error::Public landing did not become healthy within 60s"
              exit 1
            fi

            redirects_ready=false
            for i in $(seq 1 20); do
              login_target="$(curl -sS -o /dev/null -w '%{redirect_url}' "${origin}/auth/login")"
              logout_target="$(curl -sS -o /dev/null -w '%{redirect_url}' "${origin}/auth/logout")"

              if [[ "$login_target" == https://account.arvexo.ru/* ]] \
                 && [[ "$logout_target" == "${origin}/" ]]; then
                redirects_ready=true
                echo "Auth redirects healthy after ${i} attempt(s)."
                break
              fi

              echo "Attempt ${i}/20: auth redirects not ready yet; login=${login_target} logout=${logout_target}"
              sleep 3
            done
            if [ "$redirects_ready" != true ]; then
              echo "::error::Auth redirects did not become healthy within 60s"
              exit 1
            fi
