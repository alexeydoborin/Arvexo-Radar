# Production compose file. Deliberately standalone rather than an override
# of docker-compose.yml: Compose's merge semantics for lists (ports, volumes)
# depend on `!reset`/`!override` YAML tags that need a fairly recent Compose
# CLI, which a deploy server isn't guaranteed to have. A self-contained file
# is more portable and its behavior is visible without cross-referencing
# another file. Keep it in sync with docker-compose.yml when service shape
# changes (see docs/22-ci-cd.md).
#
# Usage on the deploy server (see .github/workflows/cd.yml):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires a .env file (copy .env.example) with real secrets/image tags —
# never committed (docs/16-security.md SEC-09).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arvexo}
      # No fallback: a missing password must fail the deploy, not start the
      # database with the well-known development credentials.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arvexo_radar}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not published outside the Docker network in production
    # (docs/16-security.md: "DB не публикуется в production profile").
    # Only on the internal `data` network: reachable from api/worker, never
    # from web and without any route to the internet.
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arvexo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage-init:
    image: ${API_IMAGE}
    # api/worker run as UID 1001. Volumes created while they still ran as
    # root keep root-owned files, so hand them over once per deploy; this is
    # the only container that runs as root, with no network and only the
    # capabilities chown needs.
    user: "0:0"
    command: chown -R 1001:1001 /data/storage /data/model-cache
    volumes:
      - controlled_storage:/data/storage
      - model_cache:/data/model-cache
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    restart: "no"

  api:
    image: ${API_IMAGE}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # Multipart uploads spool here (up to ARVEXO_MAX_UPLOAD_BYTES each,
      # ARVEXO_MAX_CONCURRENT_UPLOADS at a time).
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    volumes:
      - controlled_storage:/data/storage
    ports:
      # Loopback-only: nginx (already on 80/443) reverse-proxies
      # radar.arvexo.ru here, the app is never reachable on this port
      # directly from outside the server. Override API_HOST_PORT in .env
      # if it collides with something else already bound on the host.
      - "127.0.0.1:${API_HOST_PORT:-38000}:8000"
    networks:
      - data
      - egress
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${API_IMAGE}
    command: python -m app.worker.main
    env_file: .env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - controlled_storage:/data/storage
      - model_cache:/data/model-cache
    networks:
      - data
      - egress
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    # Pass only frontend runtime settings. The root .env also contains database
    # and LLM credentials that must never be available to the web process.
    environment:
      ARVEXO_ACCOUNT_API_URL: ${ARVEXO_ACCOUNT_API_URL:-http://localhost:8032}
      ARVEXO_RADAR_CLIENT_ID: ${ARVEXO_RADAR_CLIENT_ID:-arvexo-radar}
      ARVEXO_RADAR_CLIENT_SECRET: ${ARVEXO_RADAR_CLIENT_SECRET:?ARVEXO_RADAR_CLIENT_SECRET is required}
      ARVEXO_RADAR_SESSION_SECRET: ${ARVEXO_RADAR_SESSION_SECRET:?ARVEXO_RADAR_SESSION_SECRET is required}
      ARVEXO_RADAR_CALLBACK_URL: ${ARVEXO_RADAR_CALLBACK_URL:?ARVEXO_RADAR_CALLBACK_URL is required}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777,uid=1001,gid=1001
      - /app/.next/cache:rw,noexec,nosuid,size=128m,mode=0755,uid=1001,gid=1001
    ports:
      # Same loopback-only pattern as api — nginx proxies radar.arvexo.ru
      # here; override WEB_HOST_PORT in .env if it collides.
      - "127.0.0.1:${WEB_HOST_PORT:-38080}:3000"
    # Isolated network: the browser reaches the API through nginx, so the web
    # server never needs db or api. A compromised web container (incident of
    # 2026-09-24) must not be able to reach Postgres or api's internal port.
    networks:
      - web
    depends_on:
      - api
    restart: unless-stopped

networks:
  # db <-> api/worker only; `internal` removes the route to the internet.
  data:
    internal: true
  # Outbound access for api/worker (LLM providers).
  egress:
  # web alone: outbound to Arvexo Account for the SSO code exchange.
  web:

volumes:
  db_data:
  controlled_storage:
  model_cache:
